name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Save observations in the site-watch-history branch.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore durable history
        id: history
        run: python history_store.py restore >> "$GITHUB_OUTPUT"
      # One-time migration: after the data branch exists, the cache is not used.
      - uses: actions/cache/restore@v4
        if: steps.history.outputs.restored == 'false'
        with:
          path: docs/history.json
          key: site-watch-history-${{ github.run_id }}
          restore-keys: |
            site-watch-history-
      - name: Report a new history
        if: steps.history.outputs.restored == 'false'
        run: |
          if [ ! -f docs/history.json ]; then
            echo '::warning::No saved history is available. History starts with this run.'
          fi
      - run: pip install 'httpx>=0.27,<1'
      - run: python build_pages.py
      - name: Save history before deployment
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python history_store.py save
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
